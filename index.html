<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Bloomberg Adria · Kalendar komercijalnih projekata 2027">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Kalendar projekata 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: a year as a wall of twelve saturated tiles (one hue per month, a full turn of the colour wheel, winter ending in ice),
   a season strip to jump between them, and a full-screen project brief that takes on the month's colour. */
:root{
  color-scheme:dark;
  --bg:#07080c;
  --bg-2:#0e1017;
  --line:#22263a;
  --fg:#f2f3f8;
  --muted:#8e95ab;
  --faint:#555d75;
  --hl:#5b4dff;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (max-width:540px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ---------- hero ---------- */
.hero{position:relative;padding-block:36px 26px;isolation:isolate}
.aurora{position:absolute;inset:-120px 0 auto;height:520px;z-index:-1;filter:blur(70px);opacity:.38;pointer-events:none;
  background:radial-gradient(30% 50% at 12% 40%,#5b4dff,transparent 70%),radial-gradient(26% 46% at 40% 20%,#14b8d4,transparent 70%),radial-gradient(28% 50% at 66% 40%,#ff7a1a,transparent 70%),radial-gradient(26% 46% at 90% 30%,#f0388f,transparent 70%)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-family:var(--f-display);font-weight:800;font-stretch:115%;letter-spacing:.08em;font-size:13px}
.topline .cities{font-family:var(--f-mono);font-weight:500;font-stretch:100%;letter-spacing:.18em;color:var(--muted);font-size:11px}
.hero-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin-top:34px}
.hero h1{margin:0 0 0 -.055em;font-family:var(--f-display);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.86;letter-spacing:-.02em;font-size:clamp(40px,7.4vw,112px)}
.hero h1 .yr{display:block;-webkit-text-stroke:2px var(--fg);color:transparent;font-size:1.32em;letter-spacing:-.04em;margin-left:-.012em}
.hero h1 .yr span{color:var(--fg);-webkit-text-stroke:0}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:10px 28px;padding-bottom:10px}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-stretch:120%;font-size:clamp(28px,3.4vw,44px);line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.tagline{margin-top:18px;max-width:62ch;color:#c4c8d6;font-size:16px}
@media (max-width:860px){.hero-main{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- season strip ---------- */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding-block:12px 14px}
.strip-inner{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.seg{position:relative;border:0;border-radius:3px;height:44px;cursor:pointer;background:linear-gradient(150deg,var(--c2),var(--c1));color:var(--ink);font-family:var(--f-display);font-weight:800;font-stretch:115%;font-size:12px;letter-spacing:.06em;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:6px 8px;transition:transform .15s,filter .15s,opacity .2s}
.seg:hover{transform:translateY(-2px);filter:brightness(1.1)}
.seg .dots{display:flex;gap:3px}
.seg .dots i{width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.85}
.seg .dots i.p{opacity:.3}
.seg.off{opacity:.25}
@media (max-width:640px){.seg{height:34px;padding:4px 4px;font-size:9.5px;font-stretch:100%}.seg .dots{display:none}}

/* ---------- filter ---------- */
.filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.filter-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-right:4px}
.chip{border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:#c4c8d6;transition:all .15s}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (max-width:640px){.filter{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:-16px;padding-inline:16px}.filter::-webkit-scrollbar{display:none}.chip,.filter-label{flex:none}}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.6;margin-left:5px}

/* ---------- month tiles ---------- */
.grid{margin-top:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-bottom:20px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.month{position:relative;border-radius:10px;overflow:hidden;color:var(--ink);isolation:isolate;min-height:330px;display:flex;flex-direction:column;padding:18px 16px 14px;
  background:linear-gradient(155deg,var(--c2) 0%,var(--c1) 78%);scroll-margin-top:90px;transition:transform .25s ease,box-shadow .25s ease,opacity .25s}
.month::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.16;background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(200deg,#000,transparent 55%);mask-image:linear-gradient(200deg,#000,transparent 55%)}
.month:hover{transform:translateY(-4px);box-shadow:0 22px 50px -18px var(--c2)}
.month.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--c2)}40%{box-shadow:0 0 0 6px var(--c2)}100%{box-shadow:0 0 0 0 transparent}}
.mnum{position:absolute;right:-6px;top:-20px;z-index:-1;font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:150px;line-height:1;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px var(--ink);opacity:.28;pointer-events:none}
.mhead{display:flex;align-items:baseline;gap:10px}
.mk{font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:30px;line-height:1;letter-spacing:.01em}
.mname{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.season{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-top:2px}
.plist{margin-top:auto;padding-top:28px;display:grid;gap:7px}
.proj{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--glass-line);background:var(--glass);border-radius:7px;padding:10px 38px 10px 12px;cursor:pointer;color:var(--ink);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .15s,transform .15s,opacity .2s}
.proj:hover{background:var(--glass-hi);transform:translateX(2px)}
.proj .role{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.78}
.proj .pt{display:block;font-family:var(--f-display);font-weight:900;font-stretch:108%;text-transform:uppercase;line-height:1.1;margin-top:3px;font-size:17.5px;text-wrap:balance}
.proj .meta{display:block;font-family:var(--f-mono);font-size:11px;margin-top:5px;opacity:.85;font-variant-numeric:tabular-nums}
.proj .go{position:absolute;right:10px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--c1);font-size:12px;font-weight:700;transition:transform .15s}
.proj:hover .go{transform:scale(1.12)}
.proj.pending{cursor:default;background:transparent;border-style:dashed;opacity:.62}
.proj.pending:hover{transform:none}
.proj.dim{opacity:.18}
.proj.hit{background:rgba(8,10,16,.42);color:#fff;box-shadow:0 0 0 2px #fff inset,0 6px 18px -6px rgba(0,0,0,.45)}
.proj.hit .go{background:#fff;color:#0b0e17}
.month.off{opacity:.35}
.foot{border-top:1px solid var(--line);margin-top:20px;padding-block:18px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-stretch:115%;letter-spacing:.06em;color:var(--muted);font-size:12px}
.foot .hint{font-family:var(--f-body);font-weight:400;font-stretch:100%;letter-spacing:0;font-size:13px}

/* ---------- full-screen brief ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;opacity:0;transform:scale(.985);transition:opacity .22s ease,transform .22s ease}
.ov.on{opacity:1;transform:none}
.ov-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:rgba(7,8,12,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ov-bar .crumb{flex:1;min-width:0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-bar .crumb i{display:inline-block;width:10px;height:10px;border-radius:2px;background:linear-gradient(150deg,var(--c2),var(--c1));vertical-align:-1px;margin-right:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg-2);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;transition:border-color .15s,filter .15s}
.btn:hover{border-color:var(--faint)}
.btn.dl{background:var(--c2);border-color:var(--c2);color:var(--ink)}
.btn.dl:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.sq{padding:8px 11px}
@media (max-width:600px){.btn .long{display:none}.ov-bar{gap:6px}}

.bhero{position:relative;overflow:hidden;isolation:isolate;color:var(--ink);background:linear-gradient(150deg,var(--c2) 0%,var(--c1) 85%)}
.bhero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.14;background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%)}
.bhero .big{position:absolute;right:-2vw;bottom:-6vw;z-index:-1;font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:clamp(160px,26vw,380px);line-height:.8;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px var(--ink);opacity:.22;pointer-events:none}
.bhero-in{max-width:1180px;margin:0 auto;padding-block:48px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px}
.eyebrow span{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:3px 10px;opacity:.9}
.bt{font-family:var(--f-display);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.92;letter-spacing:-.015em;font-size:clamp(36px,6.4vw,84px);margin:20px 0 12px;max-width:15ch;text-wrap:balance}
.btag{font-size:clamp(15px,1.6vw,18px);max-width:60ch;margin:0;opacity:.88}
.kpis{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:30px;padding-top:18px;border-top:1px solid var(--glass-line)}
.kpi b{display:block;font-family:var(--f-display);font-weight:900;font-stretch:118%;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.inds{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.inds span{font-size:12.5px;font-weight:500;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:4px 11px}

.bbody{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding-block:44px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.toc{position:sticky;top:76px;align-self:start;display:grid;gap:2px}
.toc a{display:block;color:var(--muted);text-decoration:none;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding:7px 0 7px 12px;border-left:2px solid var(--line);transition:color .15s,border-color .15s}
.toc a:hover,.toc a.on{color:var(--fg);border-left-color:var(--c2)}
@media (max-width:860px){.bbody{grid-template-columns:minmax(0,1fr);gap:0;padding-top:28px}.toc{display:none}}
.content{min-width:0}
.lead{font-family:var(--f-display);font-weight:700;font-stretch:104%;font-size:clamp(21px,2.3vw,28px);line-height:1.22;margin:0 0 18px;max-width:34ch;text-wrap:balance}
.p{margin:0 0 12px;color:#c6cad8;max-width:66ch;font-size:16px}
.p strong,.list li strong{color:var(--fg)}
.callout{margin:22px 0 0;padding:18px 20px;border-radius:8px;background:linear-gradient(120deg,color-mix(in srgb,var(--c2) 22%,transparent),color-mix(in srgb,var(--c1) 10%,transparent));border:1px solid color-mix(in srgb,var(--c2) 40%,transparent);font-weight:600;font-size:16.5px;max-width:66ch}
.sec{margin-top:56px;scroll-margin-top:80px}
.h{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c2);margin:0 0 10px;font-weight:600}
.h::after{content:"";flex:1;height:1px;background:var(--line)}
.h2{font-family:var(--f-display);font-weight:800;font-stretch:110%;font-size:clamp(22px,2.4vw,30px);line-height:1.12;margin:0 0 12px;max-width:28ch;text-wrap:balance}
.list{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;max-width:70ch}
.list li{position:relative;padding-left:22px;color:#c6cad8;font-size:15.5px}
.list li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:2px;background:linear-gradient(150deg,var(--c2),var(--c1))}
.bens{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.ben{border:1px solid var(--line);background:var(--bg-2);border-radius:8px;padding:16px;position:relative;overflow:hidden}
.ben::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--c2),var(--c1))}
.ben h4{margin:0 0 6px;font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:16px;line-height:1.2}
.ben p{margin:0;color:#b9bdcc;font-size:14.5px}
.ben .n{font-family:var(--f-mono);font-size:11px;color:var(--c2);letter-spacing:.1em}
.qs{display:grid;gap:8px;margin-top:16px;max-width:70ch}
.q{display:flex;gap:14px;align-items:baseline;padding:12px 16px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);font-size:16px;font-weight:500}
.q b{font-family:var(--f-display);font-weight:900;font-stretch:120%;color:var(--c2);font-size:18px;min-width:26px}
.after{margin-top:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.col{border-radius:8px;padding:16px;background:var(--bg-2);border:1px solid var(--line)}
.col h4{margin:0 0 6px;font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--c2)}
.col p{margin:0;color:#c6cad8;font-size:14.5px}

.tscroll{overflow-x:auto;margin-top:18px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2)}
table.pk{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
table.pk th,table.pk td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.pk thead th{font-family:var(--f-display);font-weight:900;font-stretch:115%;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--fg);background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 16%,transparent),transparent);border-bottom:2px solid var(--c2)}
table.pk thead th:first-child{font-family:var(--f-mono);font-weight:600;font-stretch:100%;font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
table.pk .badge{display:inline-block;margin-top:5px;font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;background:var(--c2);color:var(--ink);border-radius:3px;padding:2px 6px}
table.pk td:first-child{color:#c6cad8;width:40%}
table.pk td:not(:first-child){font-variant-numeric:tabular-nums;font-weight:500}
table.pk tr:hover td{background:rgba(255,255,255,.02)}
table.pk tr.price td{border-bottom:0;font-family:var(--f-display);font-weight:900;font-stretch:112%;font-size:19px;color:var(--fg);background:color-mix(in srgb,var(--c2) 12%,transparent)}
table.pk tr.price td:first-child{font-family:var(--f-mono);font-weight:600;font-stretch:100%;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
table.pk .rec{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--c2);margin-top:4px}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
.pkg{position:relative;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.pkg-top{padding:16px 18px 14px;background:linear-gradient(150deg,var(--c2),var(--c1));color:var(--ink);position:relative}
.pkg-top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:12px;background:radial-gradient(circle at 6px 6px,var(--bg-2) 5px,transparent 5.5px) 0 0/16px 12px repeat-x}
.pkg-name{display:block;font-family:var(--f-display);font-weight:900;font-stretch:118%;text-transform:uppercase;font-size:17px;line-height:1.1}
.pkg-price{display:block;font-family:var(--f-display);font-weight:900;font-stretch:112%;font-size:30px;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.pkg-tag{display:inline-block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);border-radius:3px;padding:1px 6px;margin-bottom:8px}
.pkg-body{padding:18px}
.pkg-note{margin:0 0 10px;color:var(--muted);font-size:14px;font-style:italic}
.pkg .list{margin-top:0;gap:8px}
.pkg .list li{font-size:14.5px}
.pkg .phase{padding:0;margin-top:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c2)}
.pkg .phase::before{display:none}
.notes{margin-top:18px;display:grid;gap:8px;max-width:72ch}
.notes p{margin:0;color:#c6cad8;font-size:14.5px}
.notes p.small{color:var(--muted);font-size:13.5px}
.close{margin-top:60px;padding:34px 0 0;border-top:3px solid var(--c2);font-family:var(--f-display);font-weight:900;font-stretch:115%;text-transform:uppercase;font-size:clamp(22px,2.8vw,36px);line-height:1.08;max-width:24ch;text-wrap:balance}

 i Hercegovina, Hrvatska, Srbija, Slovenija i Sjeverna Makedonija.","Multiplatforma","Bloomberg Adria digitalna platforma, newsletter i društvene mreže.","Doseg","Više od 4 milijuna korisnika i 300.000 newsletter pretplatnika.","Kontekst","Premium poslovni kontekst uz vodeće donositelje odluka u regiji.","Odaberite format","Native intervju","Lider tvrtke kroz pitanja Bloomberg Adrije predstavlja poslovna očekivanja, strateške prioritete i ključne planove za 2027. godinu.","Autorski tekst","Stručni pogled lidera na trendove, promjene i prilike koje će oblikovati industriju i tržište u sljedećoj godini.","Spotlight paket","**Specifikacija materijala:** partner dostavlja tekst intervjua ili autorski tekst na engleskom jeziku, opremljen naslovom i jednim međunaslovom, jednu portretnu fotografiju sugovornika i jednu do dvije prateće fotografije u JPG formatu.","~Sve objave na Bloomberg Adria multiplatformi jasno su označene kao sponzorirani sadržaj.","Spotlight","3.000 EUR bez PDV-a","**Native intervju ili autorski tekst na engleskom jeziku:** predstavljanje poslovne vizije, ključnih prioriteta i očekivanja lidera za 2027. godinu.","**Regionalna digitalna objava** u okviru posebnog izdanja The Year Ahead 2027 na svih pet Bloomberg Adria tržišta: BiH, Hrvatska, Srbija, Slovenija i Sjeverna Makedonija.","**Newsletter distribucija:** dodatna promocija sadržaja kroz Bloomberg Adria newsletter izdanja na svih pet tržišta.","**LinkedIn objava:** pozicioniranje sadržaja pred regionalnom poslovnom zajednicom i publikom donositelja odluka.","**Instagram i Facebook objave:** prilagođeni vizualni formati s ključnom porukom i izravnim pozivom na čitanje sadržaja.","Trajanje projekta","Rok za materijale","Boardroom","Godišnji program komunikacije namijenjen C-level donositeljima poslovnih odluka.","Jačamo liderske pozicije. Gradimo kredibilitet. Oblikujemo poslovne razgovore.","Pomažemo tvrtkama da komuniciraju svoju strategiju, poslovne rezultate, ključne investicije i stavove o najvažnijim ekonomskim temama kroz kredibilitet i doseg Bloomberg Adrije.","Vaša priča, naša publika na 5 tržišta: Bloomberg Adria kontekst i distribucija.","Program koji traje cijelu godinu","Godina pred nama","Započnite godinu sa strateškom perspektivom: ekskluzivni intervju s predsjednikom uprave, CEO-om ili drugim C-level donositeljem odluka u izdanju The Year Ahead 2027.","Intervjui s C-levelom","Intervjui s CEO, CFO, COO, CIO, CRO, CMO i drugim C-level donositeljima poslovnih odluka tijekom cijele godine.","Prioritetna priopćenja","Objava najvažnijih korporativnih vijesti tijekom cijele godine.","Potpuna digitalna distribucija","Bloomberg Adria portal, Daily Newsletter i LinkedIn.","Komunikacijski paketi","Odaberite paket koji najbolje odgovara komunikacijskim prioritetima vaše tvrtke.","Essential","Executive","Signature","NAJPOPULARNIJE","The Year Ahead (CEO)","Intervju s C-level donositeljima poslovnih odluka","1 intervju","do 3 intervjua","do 5 intervjua","Korporativna priopćenja","Bloomberg Businessweek Adria (tiskano izdanje)","1/1 stranica","2/1 stranice (duplerica)","Promocija u Daily Newsletteru","LinkedIn promocija","9.500 EUR","15.500 EUR","**Fleksibilan program** prilagođen komunikacijskim ciljevima vaše tvrtke.","~Sav sadržaj objavljen u okviru programa Bloomberg Adria Boardroom jasno je označen kao sponzorirani sadržaj."],"rs":["Šta pokreće Adriju?","Automotive 2027.","Predstavite prednosti, funkcionalnosti i dizajn svog novog ili aktuelnog modela publici koja odlučuje o kupovini i poslovnim flotama.","Novi modeli i tehnologije menjaju ponudu na tržištu. Finansiranje, bezbednost i trošak korišćenja određuju izbor.","U prolećnoj sezoni predstavljanja modela i novih ponuda, Bloomberg Adria kroz poslovnu i finansijsku računicu kupca daje vašoj automotive ponudi veću vidljivost kod ključne ciljne grupe i pomaže vam da se istaknete na tržištu.","Omogućavamo vam posebno označen prostor na našim kanalima da argumentujete zašto vaša ponuda zaslužuje da uđe u izbor kupca.","Publika koja procenjuje vrednost","Menadžeri i preduzetnici koji biraju za sebe i svoje kompanije.","Obraćamo se poslovnoj publici kojoj su pri izboru automobila važni kvalitet, tehnologija i opravdanost ulaganja.","Korist za vaš brend","Objasnite prednosti ponude","šta vaš model donosi u bezbednosti, performansama i svakodnevnom korišćenju.","Predstavite ekonomiku izbora","finansiranje, trošak korišćenja i rešenja za poslovne flote.","Povežite predstavljanje s ponudom","od video razgovora i native intervjua do newsletter promocije s pozivom na akciju, prema odabranom paketu.","Svaki partner dobija sopstvenu, jasno označenu komercijalnu priču na jeziku izabranog tržišta, objedinjenu na projektnoj stranici **„Šta pokreće Adriju?“**","Paketi partnerstva","Jedna produkcija. Distribucija prema vašim komercijalnim ciljevima.","Starter","Accelerate","Drive","Video native intervju: 3–4 pitanja, odgovor do jednog minuta","Emitovanje kompletnog video native intervjua na Bloomberg Adria TV","Native intervju sa integrisanim kompletnim videom na 1 izabranoj podstranici portala bloombergadria.com","Social video isečci: vertikalni format za LinkedIn, IG/FB Story","1 aktivacija","2 aktivacije","Newsletter promocija: brand visibility, ponuda i poziv na akciju","Investicija, bez PDV-a","2.500 EUR","4.500 EUR","6.500 EUR","**Svi paketi se odnose na jedno izabrano tržište:** BiH, Hrvatsku, Srbiju, Sloveniju ili Severnu Makedoniju.","Rane rezervacije","Early Booking · sponzorstvo Bloomberg Adria Daily newslettera","Predstavite svoju ponudu poslovnoj publici dok planira putovanja i rane rezervacije.","Za hotele, turističke kompanije i pružaoce usluga putovanja, rana rezervacija znači ranije obezbeđen prihod i bolju osnovu za planiranje sezone.","Sponzorstvo dnevnog Bloomberg Adria newslettera povezuje vaš brend i early booking ponudu sa publikom na izabranom lokalnom tržištu ili na svih **pet tržišta Adria regiona**.","Direktan link vodi čitaoca na vašu ponudu ili stranicu za rezervaciju.","Vaša ponuda u poslovnoj dnevnoj rutini","Menadžeri, preduzetnici i profesionalci koji planiraju privatna i poslovna putovanja.","Predstavite im destinaciju, kongresne kapacitete, smeštaj, corporate team building ponudu ili pogodnosti koje utiču na izbor: cenu, uslove rezervacije, način plaćanja i dodatne usluge.","Korist za partnera","Prepoznatljiva pozicija","logo neposredno ispod zaglavlja dnevnog newslettera, uz oznaku sponzorstva.","Konkretna ponuda","premium display pozicija za early booking cene, pakete ili pogodnosti.","Direktan pristup rezervaciji","link na vaš booking sistem, ponudu ili odredišnu stranicu.","Kontinuitet komunikacije","paket od tri slanja omogućava predstavljanje ponude, dodatne razloge za izbor i podsetnik na rok rezervacije.","**Vaš brend uz poslovni sadržaj koji publika prati. Vaša ponuda na jednom kliku.**","Paketi i sadržaj sponzorstva","Svako slanje uključuje logo partnera ispod zaglavlja newslettera, jednu premium display poziciju i direktan link na digitalni kanal partnera, uz jasno označeno sponzorstvo.","Tržišta","Broj slanja","Investicija*","Paket","**MARKET ENTRY**","**1.200 EUR**","**EARLY BOOKING FLIGHT**<span class='rec'>PREPORUČENI PAKET</span>","**2.700 EUR**","**REGIONAL REACH**","1 po tržištu","**4.500 EUR**","**REGIONAL BOOKING**","3 po tržištu","**9.900 EUR**","Early Booking Flight: tri flight-a komercijalne kampanje, 900 EUR po slanju","Predstavite ponudu","hotel, hotelski lanac ili destinaciju, uz early booking uslove.","Istaknite vrednost","sadržaji, pogodnosti i razlozi za izbor.","Podsetite na rezervaciju","rok važenja ponude i poziv na akciju.","Dostupna tržišta: **BiH, Hrvatska, Srbija, Slovenija i Severna Makedonija.**","~*Cene bez PDV-a. Format obuhvata sponzorstvo newslettera; produkcija native teksta i intervjua nije uključena.","Sledeći kvadrat","Nekretnine, kapital i gradnja","Pozicionirajte svoju kompaniju pred publikom koja odlučuje o nekretninama, kapitalu i gradnji.","Vrednost nekretnine počinje pre prodaje. Određuju je lokacija, finansiranje, kvalitet gradnje i način upravljanja.","Bloomberg Adria okuplja aktere koji grade, finansiraju i oblikuju tržište nekretnina. Partnerima otvara prostor da predstave svoje projekte, ekspertizu i rešenja kroz pitanja važna za poslovnu odluku.","Jedno snimanje, više kanala. Video, digital, društvene mreže i newsletter, uz dodatnu mogućnost plasmana u magazinu Businessweek Adria.","Pred ljudima koji procenjuju sledeću investiciju","Investitori, vlasnici kompanija, menadžeri i profesionalci povezani s tržištem nekretnina.","Serijal donosi perspektive investitora, projektnih menadžera, banaka, građevinskih kompanija, arhitekata, agencija i drugih učesnika na tržištu.","Predstavite poslovnu vrednost","objasnite šta vaš projekat ili rešenje donosi kupcu, investitoru ili korisniku prostora.","Pokažite ekspertizu","odgovorite na konkretna pitanja o finansiranju, gradnji, tržištu ili upravljanju nekretninama.","Obezbedite kontinuitet prisustva","plasman komercijalnog intervjua na našem TV kanalu, portalu, društvenim mrežama i u newsletteru, uz dodatnu vidljivost kroz digital display kampanju.","**Vaša ponuda u kontekstu tržišta, upotpunjena argumentima koji će vam pomoći da se istaknete u komunikaciji prema poslovnoj publici.**","Dva paketa. Precizno definisana ponuda.","Foundation","Skyline","Video native intervju sa predstavnikom kompanije, 3–4 pitanja","Emitovanje video native intervjua na Bloomberg Adria TV","3 emitovanja","Social video isečci, vertikalni format za LinkedIn, IG/FB Story","Native tekst u formatu komercijalnog intervjua, sa integrisanim kompletnim videom","Newsletter objava","Logotip partnera u završnom kadru videa","Display kampanja na izabranoj lokalnoj podstranici portala, 970 × 250 desktop i 300 × 250 mobile, jedno izabrano tržište","7 dana, 20% rotacije","Cela unutrašnja oglasna strana u magazinu Bloomberg Businessweek Adria","1, u izabranom jezičkom izdanju","5.500 EUR","Žene koje odlučuju","Moć, kapital i poslovne odluke. Invitation only poslovni okrugli sto i večera, mart 2027.","Povežite svoju kompaniju sa liderkama koje odlučuju o kapitalu, tehnologiji i rastu.","Bloomberg Adria okuplja **24–30 poslovnih liderki**, isključivo uz lični poziv, za moderirani razgovor i privatnu večeru.","U središtu su odluke koje menjaju kompanije: gde investirati, kako primeniti veštačku inteligenciju, razvijati talente i upravljati transformacijom i promenama.","Partnerstvo donosi neposredan kontakt sa relevantnim poslovnim krugom i prisustvo kroz komercijalni sadržaj pre i posle događaja.","Poslovna odgovornost za istim stolom","Predsednice i članice uprava. Vlasnice kompanija. Regionalne direktorke. Liderke u finansijama, tehnologiji i transformaciji.","Pažljivo odabrane učesnice iz različitih industrija povezuje odgovornost za kapital, ljude i poslovne rezultate.","Format koji otvara prostor za kvalitetan razgovor","Uvodni razgovor","2–3 vodeće liderke, 25–30 minuta.","Okrugli sto","moderirana razmena iskustava i poslovnih perspektiva.","Privatna večera","nastavak razgovora i uspostavljanje poslovnih kontakata.","**Korist za partnera:** direktan kontakt sa donositeljkama odluka, prostor za predstavljanje relevantne ekspertize i povezivanje brenda sa temama poslovnog liderstva.","Nivoi partnerstva","Ograničen broj partnera. Kontekstualno brendiranje.","Glavni partner","5.500 EUR + PDV","Jedan strateški partner. Najširi paket povezuje native sadržajnu kampanju, prisustvo na događaju i native intervju sa predstavnicom partnera.","#Pre događaja","**Tri native članka uz video** na portalu Bloomberg Adria, u periodu do dva meseca pre okupljanja.","#Tokom događaja","Učešće u pažljivo organizovanom poslovnom povezivanju sa liderkama.","Ciljana promocija kroz poklone za učesnice i mogućnost ankete.","**Native intervju u trajanju od 10 minuta**, uz objavu na Bloomberg Adria TV, bloombergadria.com portalu i Bloomberg Adria LinkedIn stranici.","#Posle događaja","Prisustvo partnera u native video i pisanom izveštaju sa događaja.","Distribucija native izveštaja kroz TV, portal, newsletter i LinkedIn.","Sektorski partner","3.500 EUR + PDV","Maksimalno dva partnera iz različitih industrija.","Dva native članka uz video na portalu Bloomberg Adria, u periodu do dva meseca pre okupljanja.","Učešće u organizovanom poslovnom povezivanju i snimanje izjave do tri minuta, uz objavu na TV-u, portalu i LinkedInu.","Prisustvo u native video i pisanom izveštaju, distribuiranom kroz TV, portal, newsletter i LinkedIn.","Experiential partner","2.500 EUR + PDV","Jedan native članak uz video na portalu Bloomberg Adria, u periodu do dva meseca pre okupljanja.","Učešće u organizovanom poslovnom povezivanju sa liderkama.","Biznis luksuza","Vrednost brenda. Kvalitet. Ekskluzivnost. Bloomberg Adria Prestiž, april 2027.","Predstavite svoj brend poslovnoj publici kroz vrednost koja opravdava luksuzni izbor.","U luksuznom segmentu cena je samo deo odluke. Važni su poreklo, izrada, inovacija, usluga i iskustvo.","Bloomberg Adria povezuje poslovnu priču vašeg brenda sa predstavljanjem proizvoda i usluga, kroz native objave i komercijalnu kampanju u rubrici Prestiž na portalu bloombergadria.com, u magazinu Bloomberg Businessweek Adria, nedeljnom newsletteru Bloomberg Adria Luxury i na Bloomberg Adria TV kanalu.","Istaknuti prostor u okviru Bloomberg Adria lifestyle vertikale pruža vam izuzetnu mogućnost da predstavite vrednost svog brenda, uz komercijalnu kampanju kroz celu Bloomberg Adria multiplatformu.","Publika koja bira prema vrednosti","Vlasnici kompanija, menadžeri i poduzetnici zainteresovani za luksuzne proizvode, usluge i iskustva.","Od automobila, satova i nakita do hotela, putovanja, nekretnina i personalizovanih finansijskih usluga, projekat predstavlja ponudu kroz kvalitet i poslovnu filozofiju brenda.","Objasnite vrednost prestiža","predstavite nasleđe, izradu, inovacije i standard usluge.","Povežite priču s ponudom","istaknite novu kolekciju, model, d ciju postojeće kampanje ili predstaviti konkretan proizvod kroz novi sadržaj.","Sadržaj, kampanja i kratki video","Izaberite format prema prodajnom cilju.","Poslovna priča","1.500 EUR","Jedan PR tekst na portalu izabranog tržišta.","Jedno deljenje na Instagram story sa linkom ka tekstu.","Baner u zaglavlju newslettera: 970 × 250 desktop i 320 × 250 mobile.","Deset dana display kampanje: 970 × 250 desktop i 300 × 250 mobile, uz 20% rotacije, na jednom izabranom tržištu.","Nadogradnja TV","2.000 EUR","Emitovanje postojeće TV reklame klijenta, u trajanju do 3 minuta: deset emitovanja na Bloomberg Adria TV na jednom izabranom tržištu.","Jedno deljenje na Facebook i Instagram kanalima izabranog tržišta.","Praznični izbor","Produkcija jednog native video formata do dva minuta.","Deset emitovanja native video formata na Bloomberg Adria TV na jednom izabranom tržištu.","The Year Ahead","Business leaders’ perspectives. Regionalni native projekat za 2027.","Vizije lidera. Smer poslovanja za 2027.","Regionalni projekat Bloomberg Adrije koji okuplja vodeće poslovne lidere i donosi njihove prognoze, prioritete i planove za godinu pred nama.","The Year Ahead se realizuje jednom godišnje, u trenutku kada se definišu ključne poslovne teme i agenda za narednih 12 meseci.","Jedna priča. Pet tržišta. Regionalna vidljivost.","Jedna priča, pet tržišta","Pozicionirajte lidera i kompaniju kroz viziju, prioritete i pogled na trendove koji će oblikovati 2027. godinu.","Pet tržišta","Bosna i Hercegovina, Hrvatska, Srbija, Slovenija i Severna Makedonija.","Multiplatforma","Bloomberg Adria digitalna platforma, newsletter i društvene mreže.","Doseg","Više od 4 miliona korisnika i 300.000 newsletter pretplatnika.","Kontekst","Premium poslovni kontekst uz vodeće donosioce odluka u regionu.","Izaberite format","Native intervju","Lider kompanije kroz pitanja Bloomberg Adrije predstavlja poslovna očekivanja, strateške prioritete i ključne planove za 2027. godinu.","Autorski tekst","Ekspertski pogled itetna saopštenja","Objava najvažnijih korporativnih vesti tokom cele godine.","Potpuna digitalna distribucija","Bloomberg Adria portal, Daily Newsletter i LinkedIn.","Komunikacijski paketi","Izaberite paket koji najbolje odgovara komunikacionim prioritetima vaše kompanije.","Essential","Executive","Signature","NAJPOPULARNIJE","The Year Ahead (CEO)","Intervju sa C-level donosiocima poslovnih odluka","1 intervju","do 3 intervjua","do 5 intervjua","Korporativna saopštenja","Bloomberg Businessweek Adria (print izdanje)","1/1 strana","2/1 strane (duplerica)","Promocija u Daily Newsletteru","LinkedIn promocija","9.500 EUR","15.500 EUR","**Fleksibilan program** prilagođen komunikacionim ciljevima vaše kompanije.","~Sav sadržaj objavljen u okviru Bloomberg Adria Boardroom programa jasno je označen kao sponzorisani sadržaj."],"si":["Kaj poganja Adrijo?","Automotive 2027.","Predstavite prednosti, funkcionalnosti in dizajn svojega novega ali aktualnega modela občinstvu, ki odloča o nakupu in poslovnih voznih parkih.","Novi modeli in tehnologije spreminjajo ponudbo na trgu. Financiranje, varnost in stroški uporabe določajo izbiro.","V pomladni sezoni predstavitev modelov in novih ponudb Bloomberg Adria skozi poslovno in finančno računico kupca vaši avtomobilski ponudbi zagotavlja večjo prepoznavnost pri ključni ciljni skupini in vam pomaga, da izstopate na trgu.","Omogočamo vam posebej označen prostor na naših kanalih, kjer utemeljite, zakaj si vaša ponudba zasluži mesto v izbiri kupca.","Občinstvo, ki presoja vrednost","Menedžerji in podjetniki, ki izbirajo zase in za svoja podjetja.","Nagovarjamo poslovno občinstvo, ki mu je pri izbiri avtomobila pomembna kakovost, tehnologija in upravičenost naložbe.","Korist za vašo blagovno znamko","Pojasnite prednosti ponudbe","kaj vaš model prinaša na področju varnosti, zmogljivosti in vsakdanje uporabe.","Predstavite ekonomiko izbire","financiranje, stroški uporabe in rešitve za poslovne vozne parke.","Povežite predstavitev s ponudbo","od video pogovora in native intervjuja do promocije v newsletterju s pozivom k dejanju, glede na izbrani paket.","Vsak partner dobi lastno, jasno označeno komercialno zgodbo v jeziku izbranega trga, zbrano na projektni strani **»Kaj poganja Adrijo?«**","Partnerski paketi","Ena produkcija. Distribucija glede na vaše komercialne cilje.","Starter","Accelerate","Drive","Video native intervju: 3–4 vprašanja, odgovor do ene minute","Predvajanje celotnega video native intervjuja na Bloomberg Adria TV","Native intervju z vključenim celotnim videom na 1 izbrani podstrani portala bloombergadria.com","Družbeni video izseki: navpični format za LinkedIn, IG/FB Story","1 aktivacija","2 aktivaciji","Promocija v newsletterju: prepoznavnost znamke, ponudba in poziv k dejanju","Naložba, brez DDV","2.500 EUR","4.500 EUR","6.500 EUR","**Vsi paketi se nanašajo na en izbrani trg:** BiH, Hrvaško, Srbijo, Slovenijo ali Severno Makedonijo.","Zgodnje rezervacije","Early Booking · sponzorstvo newsletterja Bloomberg Adria Daily","Predstavite svojo ponudbo poslovnemu občinstvu, ko načrtuje potovanja in zgodnje rezervacije.","Za hotele, turistična podjetja in ponudnike potovalnih storitev zgodnja rezervacija pomeni prej zagotovljen prihodek in boljšo osnovo za načrtovanje sezone.","Sponzorstvo dnevnega newsletterja Bloomberg Adria poveže vašo znamko in ponudbo zgodnjih rezervacij z občinstvom na izbranem lokalnem trgu ali na vseh **petih trgih regije Adria**.","Neposredna povezava bralca pripelje do vaše ponudbe ali strani za rezervacijo.","Vaša ponudba v poslovni dnevni rutini","Menedžerji, podjetniki in strokovnjaki, ki načrtujejo zasebna in poslovna potovanja.","Predstavite jim destinacijo, kongresne zmogljivosti, nastanitev, ponudbo za korporativni team building ali ugodnosti, ki vplivajo na izbiro: ceno, pogoje rezervacije, način plačila in dodatne storitve.","Korist za partnerja","Prepoznaven položaj","logotip neposredno pod glavo dnevnega newsletterja, z oznako sponzorstva.","Konkretna ponudba","premium display pozicija za cene, pakete ali ugodnosti zgodnjih rezervacij.","Neposreden dostop do rezervacije","povezava na vaš rezervacijski sistem, ponudbo ali ciljno stran.","Kontinuiteta komunikacije","paket treh pošiljanj omogoča predstavitev ponudbe, dodatne razloge za izbiro in opomnik na rok rezervacije.","**Vaša znamka ob poslovni vsebini, ki jo občinstvo spremlja. Vaša ponudba na en klik.**","Paketi in vsebina sponzorstva","Vsako pošiljanje vključuje logotip partnerja pod glavo newsletterja, eno premium display pozicijo in neposredno povezavo na digitalni kanal partnerja, z jasno označenim sponzorstvom.","Trgi","Število pošiljanj","Naložba*","Paket","**MARKET ENTRY**","**1.200 EUR**","**EARLY BOOKING FLIGHT**<span class='rec'>PRIPOROČENI PAKET</span>","**2.700 EUR**","**REGIONAL REACH**","1 na trg","**4.500 EUR**","**REGIONAL BOOKING**","3 na trg","**9.900 EUR**","Early Booking Flight: trije flighti komercialne kampanje, 900 EUR na pošiljanje","Predstavite ponudbo","hotel, hotelsko verigo ali destinacijo, s pogoji zgodnje rezervacije.","Izpostavite vrednost","vsebine, ugodnosti in razlogi za izbiro.","Opomnite na rezervacijo","rok veljavnosti ponudbe in poziv k dejanju.","Razpoložljivi trgi: **BiH, Hrvaška, Srbija, Slovenija in Severna Makedonija.**","~*Cene brez DDV. Format zajema sponzorstvo newsletterja; produkcija native besedila in intervjuja ni vključena.","Naslednji kvadratni meter","Nepremičnine, kapital in gradnja","Pozicionirajte svoje podjetje pred občinstvom, ki odloča o nepremičninah, kapitalu in gradnji.","Vrednost nepremičnine se začne pred prodajo. Določajo jo lokacija, financiranje, kakovost gradnje in način upravljanja.","Bloomberg Adria povezuje akterje, ki gradijo, financirajo in oblikujejo nepremičninski trg. Partnerjem odpira prostor, da predstavijo svoje projekte, strokovnost in rešitve skozi vprašanja, pomembna za poslovno odločitev.","Eno snemanje, več kanalov. Video, digital, družbena omrežja in newsletter, z dodatno možnostjo objave v reviji Businessweek Adria.","Pred ljudmi, ki presojajo naslednjo naložbo","Investitorji, lastniki podjetij, menedžerji in strokovnjaki, povezani z nepremičninskim trgom.","Serija prinaša poglede investitorjev, projektnih menedžerjev, bank, gradbenih podjetij, arhitektov, agencij in drugih udeležencev trga.","Predstavite poslovno vrednost","pojasnite, kaj vaš projekt ali rešitev prinaša kupcu, investitorju ali uporabniku prostora.","Pokažite strokovnost","odgovorite na konkretna vprašanja o financiranju, gradnji, trgu ali upravljanju nepremičnin.","Zagotovite kontinuiteto prisotnosti","objava komercialnega intervjuja na našem TV kanalu, portalu, družbenih omrežjih in v newsletterju, z dodatno prepoznavnostjo prek digitalne display kampanje.","**Vaša ponudba v kontekstu trga, dopolnjena z argumenti, ki vam bodo pomagali izstopati v komunikaciji s poslovnim občinstvom.**","Dva paketa. Natančno opredeljena ponudba.","Foundation","Skyline","Video native intervju s predstavnikom podjetja, 3–4 vprašanja","Predvajanje video native intervjuja na Bloomberg Adria TV","3 predvajanja","Družbeni video izseki, navpični format za LinkedIn, IG/FB Story","Native besedilo v formatu komercialnega intervjuja, z vključenim celotnim videom","Objava v newsletterju","Logotip partnerja v zaključnem kadru videa","Display kampanja na izbrani lokalni podstrani portala, 970 × 250 desktop in 300 × 250 mobile, en izbrani trg","7 dni, 20 % rotacije","Cela notranja oglasna stran v reviji Bloomberg Businessweek Adria","1, v izbrani jezikovni izdaji","5.500 EUR","Ženske, ki odločajo","Moč, kapital in poslovne odločitve. Poslovna okrogla miza in večerja samo na povabilo, marec 2027.","Povežite svoje podjetje z voditeljicami, ki odločajo o kapitalu, tehnologiji in rasti.","Bloomberg Adria zbere **24–30 poslovnih voditeljic**, izključno na osebno povabilo, za moderiran pogovor in zasebno večerjo.","V središču so odločitve, ki spreminjajo podjetja: kam vlagati, kako uporabiti umetno inteligenco, razvijati talente ter upravljati preobrazbo in spremembe.","Partnerstvo prinaša neposreden stik z relevantnim poslovnim krogom in prisotnost prek komercialne vsebine pred dogodkom in po njem.","Poslovna odgovornost za isto mizo","Predsednice in članice uprav. Lastnice podjetij. Regionalne direktorice. Voditeljice na področju financ, tehnologije in preobrazbe.","Skrbno izbrane udeleženke iz različnih panog povezuje odgovornost za kapital, ljudi in poslovne rezultate.","Format, ki odpira prostor za kakovosten pogovor","Uvodni pogovor","2–3 vodilne voditeljice, 25–30 minut.","Okrogla miza","moderirana izmenjava izkušenj in poslovnih pogledov.","Zasebna večerja","nadaljevanje pogovora in vzpostavljanje poslovnih stikov.","**Korist za partnerja:** neposreden stik z odločevalkami, prostor za predstavitev relevantne strokovnosti in povezovanje znamke s temami poslovnega vodenja.","Ravni partnerstva","Omejeno število partnerjev. Kontekstualno brendiranje.","Glavni partner","5.500 EUR + DDV","En strateški partner. Najobsežnejši paket povezuje native vsebinsko kampanjo, prisotnost na dogodku in native intervju s predstavnico partnerja.","#Pred dogodkom","**Trije native članki z videom** na portalu Bloomberg Adria, v obdobju do dveh mesecev pred srečanjem.","#Med dogodkom","Udeležba v skrbno organiziranem poslovnem povezovanju z voditeljicami.","Ciljana promocija prek daril za udeleženke in možnost ankete.","**Native intervju v trajanju 10 minut**, z objavo na Bloomberg Adria TV, portalu bloombergadria.com in strani Bloomberg Adria na LinkedInu.","#Po dogodku","Prisotnost partnerja v native video in pisnem poročilu z dogodka.","Distribucija native poročila prek TV, portala, newsletterja in LinkedIna.","Sektorski partner","3.500 EUR + DDV","Največ dva partnerja iz različnih panog.","Dva native članka z videom na portalu Bloomberg Adria, v obdobju do dveh mesecev pred srečanjem.","Udeležba v organiziranem poslovnem povezovanju in snemanje izjave do treh minut, z objavo na /* ---------- Project motifs: fine line art per theme, drawn in the month's ink colour ---------- */
const MOTIF=(function(){
  const r=n=>Math.round(n*10)/10;
  const L=(c,x1,y1,x2,y2,w=1,o=1,cl="d")=>`<line class="${cl}" x1="${r(x1)}" y1="${r(y1)}" x2="${r(x2)}" y2="${r(y2)}" stroke="${c}" stroke-width="${w}" stroke-opacity="${o}" stroke-linecap="round"/>`;
  const Ci=(c,x,y,rad,w=1,o=1,fill="none",cl="d")=>`<circle class="${cl}" cx="${r(x)}" cy="${r(y)}" r="${r(rad)}" stroke="${c}" stroke-width="${w}" stroke-opacity="${o}" fill="${fill}"/>`;
  const P=(c,d,w=1,o=1,ex="")=>`<path class="d" d="${d}" stroke="${c}" stroke-width="${w}" stroke-opacity="${o}" fill="none" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
  const Dot=(c,x,y,rad,o=1)=>`<circle cx="${r(x)}" cy="${r(y)}" r="${rad}" fill="${c}" fill-opacity="${o}"/>`;
  const R=(c,x,y,w,h,rx,fill,o)=>`<rect x="${r(x)}" y="${r(y)}" width="${r(w)}" height="${r(h)}" rx="${rx}" fill="${fill||c}" fill-opacity="${o}"/>`;
  const wave=(x0,x1,y,a,k,ph)=>{let d="";for(let x=x0;x<=x1;x+=6){const yy=y+a*Math.sin(x/k+ph);d+=(x===x0?"M":"L")+r(x)+" "+r(yy)}return d};
  const arc=(cx,cy,rad,a0,a1)=>{const p=a=>[cx+rad*Math.cos(a*Math.PI/180),cy+rad*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${r(x0)} ${r(y0)} A${rad} ${rad} 0 ${Math.abs(a1-a0)>180?1:0} 1 ${r(x1)} ${r(y1)}`};
  const star=(c,x,y,s,o=.8)=>L(c,x-s,y,x+s,y,1,o)+L(c,x,y-s,x,y+s,1,o)+L(c,x-s*.4,y-s*.4,x+s*.4,y+s*.4,.6,o*.6)+L(c,x-s*.4,y+s*.4,x+s*.4,y-s*.4,.6,o*.6);

  return {
  /* Auto industrija: a fine instrument dial with redline and needle */
  auto(c){let s="";const cx=440,cy=214,R=158,A0=135,SW=270,val=v=>A0+SW*v/8;
    s+=P(c,arc(cx,cy,R,A0,A0+SW),1.6,.95)+P(c,arc(cx,cy,R-26,A0,A0+SW),.7,.35)+P(c,arc(cx,cy,R+14,A0,A0+SW),.6,.2);
    s+=`<path d="${arc(cx,cy,R-8,val(6.5),val(8))}" stroke="#ff3b30" stroke-width="7" stroke-opacity=".9" fill="none" stroke-linecap="round"/>`;
    for(let i=0;i<=80;i++){const a=(A0+SW*i/80)*Math.PI/180,maj=i%10===0,mid=i%5===0,l=maj?20:mid?12:6;
      s+=L(c,cx+R*Math.cos(a),cy+R*Math.sin(a),cx+(R-l)*Math.cos(a),cy+(R-l)*Math.sin(a),maj?1.8:mid?1.1:.6,maj?.95:.6);
      if(maj){const t=R-40;s+=`<text x="${r(cx+t*Math.cos(a))}" y="${r(cy+t*Math.sin(a)+5)}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="15" font-weight="600" fill="${i>=70?"#ff5a4f":c}" fill-opacity=".95">${i/10}</text>`}}
    const na=val(5.4)*Math.PI/180;
    s+=`<line x1="${r(cx-24*Math.cos(na))}" y1="${r(cy-24*Math.sin(na))}" x2="${r(cx+(R-12)*Math.cos(na))}" y2="${r(cy+(R-12)*Math.sin(na))}" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>`;
    s+=Ci(c,cx,cy,14,1.6,.95)+Dot(c,cx,cy,5);
    s+=`<text x="${cx}" y="${cy+62}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="3" fill="${c}" fill-opacity=".7">×1000 RPM</text>`;
    s+=`<text x="${cx}" y="${cy+104}" text-anchor="middle" font-family="Archivo,Arial,sans-serif" font-size="34" font-weight="800" fill="${c}" fill-opacity=".95">2027</text>`;

  else if(e.key==="ArrowRight"&&!e.target.closest("input,textarea"))$("nextBtn").click();
  else if(e.key==="ArrowLeft"&&!e.target.closest("input,textarea"))$("prevBtn").click();
  else if(e.key==="Tab"){const f=[...$("ov").querySelectorAll("button,a[href]")].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});

/* ---------- swipe between projects (touch) ---------- */
(function(){let sx=0,sy=0,ok=false;const ov=$("ov");
  ov.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;ok=!e.target.closest(".tscroll")},{passive:true});
  ov.addEventListener("touchend",e=>{if(!ok||!current)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>80&&Math.abs(dy)<50){(dx<0?$("nextBtn"):$("prevBtn")).click()}},{passive:true});
})();
/* ---------- toast ---------- */
let tt;function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3400)}

/* ---------- PDF ---------- */
let dl=null;
(async()=>{try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){dl=null}})();
const slugFile=t=>"Bloomberg-Adria-2027-"+t.replace(/đ/g,"dj").replace(/Đ/g,"Dj").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")+".pdf";
function pdfHTML(id,mi){
  const p=P[id],m=MONTHS[mi];const pi=priceInfo(p);
  const {h}=bodyHTML(p,true);
  return `<div class="pdf" style="${varStr(m)}">
   <div class="phero">${motifSVG(id,m.ink,true)}<div class="ptop"><img class="plogo" src="${logoFor(m)}" alt="Bloomberg Adria"><span>KOMERCIJALNI PROJEKTI 2027</span></div>
    <div class="pey">${esc(p.tag)} · ${esc(monthLabel(p,mi))} 2027</div>
    <div class="pt">${esc(p.title)}</div>${p.tagline?`<p class="ptag">${esc(p.tagline)}</p>`:""}
    ${pi?`<div class="pk2"><div><b>${pi.n}</b><span>${pi.n===1?"Paket":"Paketa"}</span></div><div><b>${fmt(pi.min)} EUR</b><span>Investicija od</span></div>${pi.n>1?`<div><b>${fmt(pi.max)} EUR</b><span>Do</span></div>`:""}</div>`:""}
   </div>
   <div class="pbody">${p.ind?`<div class="pinds">${p.ind.map(i=>`<span>${esc(indName(i))}</span>`).join("")}</div>`:""}${h}</div>
   <div class="pfoot"><span class="fbrand"><img class="plogo sm" src="${LOGO_B}" alt="Bloomberg Adria"><span>KOMERCIJALNA STRATEGIJA 2027</span></span><span>${esc(m.name.toUpperCase())} 2027</span></div></div>`;
}
async function makePdfBlob(id,mi){
  await document.fonts.ready;
  const host=$("pdfhost");host.innerHTML=pdfHTML(id,mi);
  const sv=host.querySelector("svg.motif");
  if(sv){try{
    const src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(sv));
    const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=src});
    const cv=document.createElement("canvas");cv.width=860;cv.height=574;cv.getContext("2d").drawImage(im,0,0,860,574);
    const img=document.createElement("img");img.className="motif";img.width=430;img.height=287;img.alt="";img.src=cv.toDataURL("image/png");sv.replaceWith(img);
  }catch(e){sv.remove()}}
  try{
    return await html2pdf().set({
      margin:[0,0,10,0],
      image:{type:"jpeg",quality:0.95},
      html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"],avoid:[".avoid","tr",".list li",".h2",".lead",".pkg-top"]}
    }).from(host.firstElementChild).outputPdf("blob");
  }finally{host.innerHTML=""}
}
$("pdfBtn").onclick=async()=>{
  if(!current)return;
  const {id,mi}=current;
  if(!dl){toast("Preuzimanje nije dostupno u ovom prikazu. Otvorite stranicu na claude.ai.");return}
  const btn=$("pdfBtn");btn.disabled=true;const old=btn.innerHTML;btn.innerHTML="Pripremam PDF…";
  try{
    if(typeof html2pdf==="undefined")throw new Error("lib");
    const blob=await makePdfBlob(id,mi);
    await dl.save({filename:slugFile(P[id].title),data:blob});
    toast("PDF je preuzet.");
  }catch(e){
    const c=e&&e.code;
    if(c==="declined")toast("Preuzimanje otkazano.");
    else if(c==="rate_limited")toast("Prozor za preuzimanje je već otvoren.");
    else if(c==="unavailable"||c==="not_granted")toast("Preuzimanje nije dostupno u ovom prikazu.");
    else toast("PDF nije napravljen. Pokušajte ponovo.");
  }finally{btn.disabled=false;btn.innerHTML=old}
};

try{const s=localStorage.getItem("bba-ind");if(s&&IND.includes(s))activeInd=s}catch(e){}
(function(){let q=null,st=null;
  try{q=new URLSearchParams(location.search).get("m")}catch(e){}
  try{st=localStorage.getItem("bba-mkt")}catch(e){}
  const ok=v=>MARKETS.some(m=>m.id===v);
  if(ok(q))applyMarket(q,true);
  else if(ok(st))applyMarket(st,false);
  else{applyMarket("ba",false);openGate()}
})();
const hh=(location.hash||"").slice(1);if(hh&&P[hh]&&!P[hh].pending)openBrief(hh);
